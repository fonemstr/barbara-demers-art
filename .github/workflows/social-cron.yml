# Fires the scheduled-social-post check every 15 minutes. Vercel's Hobby
# plan only allows daily crons, so GitHub Actions provides the cadence.
# Requires a CRON_SECRET repository secret matching the Vercel env var.
name: social-post-scheduler
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Deliver due social posts
        run: |
          curl -fsS -m 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://www.barbarajdemers.com/api/cron/social-posts
